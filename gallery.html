<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Dog Run Cabin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; text-align: center; }
        h1 { color: #333; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .gallery-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover; /* Keeps photos from looking stretched */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .gallery-grid img:hover { transform: scale(1.05); }
        .nav-link { display: inline-block; margin-top: 20px; text-decoration: none; color: #007BFF; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Cabin Gallery</h1>
    
    <div class="gallery-grid">
        <img src="your-photo-1.jpg" alt="Cabin Exterior">
        <img src="your-photo-2.jpg" alt="Living Room">
        <img src="your-photo-3.jpg" alt="Kitchen Area">
        <img src="your-photo-4.jpg" alt="Bedroom View">
        <img src="your-photo-5.jpg" alt="Back Deck">
        <img src="your-photo-6.jpg" alt="Nearby Trails">
    </div>

    <a href="index.html" class="nav-link">← Back to Home</a>

</body>
</html>
